name: Collect finalized Bitstamp candles

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "KST report date (YYYY-MM-DD). Blank uses today's KST date."
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: bitstamp-relay-publish
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect candles
        id: collect
        env:
          REPORT_DATE: ${{ inputs.as_of_date }}
        shell: bash
        run: |
          args=()
          if [[ -n "$REPORT_DATE" ]]; then
            args+=(--as-of-date "$REPORT_DATE")
          fi
          status=0
          python collect.py "${args[@]}" || status=$?
          if [[ "$status" != 0 && "$status" != 3 ]]; then
            exit "$status"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Publish JSON to the default branch
        shell: bash
        run: |
          git add -- public/
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update BTC/USD 06:59 KST report"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Flag incomplete Bitstamp collection
        if: steps.collect.outputs.status == '3'
        run: |
          echo "::error::At least one Bitstamp candle is unavailable. See the published report."
          exit 1
